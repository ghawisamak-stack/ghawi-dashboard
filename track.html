<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2a4a">
<title>تتبع طلبك — غاوي سمك</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --deep: #0b2340; --deep2: #123a63; --accent: #1f8fd6; --accent2: #14b8a6; --hot: #f08a24; --green: #22a565; --ink: #182635; --muted: #74859a; --line: #e6edf4; --bg: #f3f6fa; --card: #fff; --gold: #f3b51b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: Tajawal, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }
  .hero { position: relative; overflow: hidden; background: linear-gradient(170deg, var(--deep) 0%, var(--deep2) 100%); color: #fff; padding: 14px 16px 92px; text-align: center; clip-path: ellipse(140% 100% at 50% 0%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(48px); opacity: .55; pointer-events: none; }
  .b1 { width: 220px; height: 220px; background: #1f8fd6; top: -60px; left: -40px; }
  .b2 { width: 200px; height: 200px; background: #14b8a6; top: 30px; right: -70px; }
  .b3 { width: 160px; height: 160px; background: #f08a24; bottom: -60px; left: 30%; opacity: .35; }
  .langs { position: relative; display: inline-flex; gap: 6px; margin-bottom: 14px; }
  .langs button { border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; border-radius: 20px; padding: 4px 14px; font: inherit; font-size: .82rem; cursor: pointer; }
  .langs button.on { background: #fff; color: var(--deep); font-weight: 800; }
  .brand { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .brand img { width: 50px; height: 50px; border-radius: 14px; background: #fff; padding: 5px; }
  .brand b { font-size: 1.2rem; font-weight: 800; }
  .tag { position: relative; opacity: .7; font-size: .82rem; margin-top: 4px; }
  .hello { position: relative; margin-top: 14px; opacity: .9; }
  .hero h1 { position: relative; margin: 4px 0 10px; font-size: 1.35rem; font-weight: 800; }
  .pill { position: relative; display: inline-block; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.2); border-radius: 20px; padding: 4px 14px; font-weight: 800; font-size: .9rem; }
  main { max-width: 540px; margin: -70px auto 24px; padding: 0 14px; position: relative; }
  .card { background: var(--card); border-radius: 20px; box-shadow: 0 10px 30px rgba(15,35,60,.08); padding: 18px; margin-bottom: 14px; }
  .now { display: flex; gap: 16px; align-items: center; }
  .ring { --p: 0; flex: none; width: 104px; height: 104px; border-radius: 50%; background: conic-gradient(var(--hot) calc(var(--p) * 1%), #edf1f6 0); display: grid; place-items: center; transition: --p 1s; }
  .ring > div { width: 84px; height: 84px; border-radius: 50%; background: #fff; display: grid; place-items: center; text-align: center; line-height: 1.1; }
  .ring .ic { font-size: 1.7rem; }
  .ring small { color: var(--hot); font-weight: 800; font-size: .85rem; }
  .now h2 { margin: 0 0 4px; font-size: 1.25rem; }
  .now p { margin: 0; color: var(--muted); font-size: .92rem; }
  .eta { display: inline-block; margin-top: 8px; background: #fff4e6; color: #a35a00; border-radius: 20px; padding: 4px 12px; font-weight: 700; font-size: .85rem; }
  .ttl { display: flex; align-items: center; gap: 8px; font-weight: 800; margin-bottom: 12px; }
  .tl { position: relative; padding-inline-start: 4px; }
  .st { position: relative; display: flex; gap: 12px; padding-bottom: 16px; }
  .st:last-child { padding-bottom: 0; }
  .st::before { content: ""; position: absolute; inset-inline-start: 15px; top: 32px; bottom: 0; width: 2px; background: var(--line); }
  .st:last-child::before { display: none; }
  .st.done::before { background: var(--green); }
  .dot { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: .95rem; background: #f1f4f8; border: 2px solid #f1f4f8; z-index: 1; }
  .st.done .dot { background: var(--green); border-color: var(--green); color: #fff; }
  .st.cur .dot { background: #fff; border-color: var(--hot); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(240,138,36,.45); } 70% { box-shadow: 0 0 0 12px rgba(240,138,36,0); } 100% { box-shadow: 0 0 0 0 rgba(240,138,36,0); } }
  .st .t { font-weight: 800; padding-top: 5px; }
  .st.wait .t { color: #a9b5c3; font-weight: 600; }
  .st.cur .t { color: var(--hot); }
  .st .d { color: var(--muted); font-size: .8rem; margin-top: 2px; }
  .here { display: inline-block; margin-top: 4px; font-size: .78rem; color: var(--hot); font-weight: 700; }
  .item { display: flex; gap: 10px; align-items: flex-start; background: #f8fafc; border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .num { flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--deep2); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: .85rem; }
  .item b { display: block; }
  .item span { color: var(--muted); font-size: .85rem; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; }
  .row b { font-weight: 800; }
  .bar { height: 10px; border-radius: 10px; background: #edf1f6; overflow: hidden; margin: 6px 0 12px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2), var(--green)); }
  .paid { text-align: center; border-radius: 12px; padding: 10px; font-weight: 800; margin-top: 8px; }
  .paid.ok { background: #e7f7ee; color: var(--green); }
  .paid.no { background: #fff4e6; color: #a35a00; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 14px; font: inherit; font-weight: 800; cursor: pointer; text-decoration: none; }
  .wa { background: #25d366; color: #fff; }
  .call { background: #eef4fb; color: var(--deep2); }
  .addr { text-align: center; margin-top: 12px; font-size: .88rem; }
  .addr a { color: var(--accent); }
  .live { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 10px; }
  .live::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-inline-end: 6px; animation: blink 1.6s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .stars { display: flex; justify-content: center; gap: 6px; direction: ltr; margin: 10px 0; }
  .stars button { background: none; border: 0; font-size: 2.3rem; cursor: pointer; color: #d5dce5; padding: 0 2px; }
  .stars button.on { color: var(--gold); }
  textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px; font: inherit; min-height: 64px; }
  .send { background: var(--deep2); color: #fff; width: 100%; margin-top: 10px; }
  .google { background: #fff; border: 2px solid var(--line); color: var(--ink); margin-top: 10px; width: 100%; }
  .muted { color: var(--muted); text-align: center; }
  .sk { height: 16px; border-radius: 8px; background: linear-gradient(90deg, #eef2f6, #f8fafc, #eef2f6); background-size: 200% 100%; animation: sk 1.2s infinite; margin: 10px 0; }
  @keyframes sk { to { background-position: -200% 0; } }
</style>
</head>
<body>
<div class="hero">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="langs"><button data-l="ar" class="on">عربي</button><button data-l="en">English</button></div>
  <div class="brand"><img src="icon.png" alt="" onerror="this.style.display='none'"><b id="store">غاوي سمك</b></div>
  <div class="tag" id="tagline">مطعم المأكولات البحرية</div>
  <div class="hello" id="hello"></div>
  <h1 id="headline">طلبك وأين وصل الآن</h1>
  <span class="pill hidden" id="orderPill"></span>
</div>
<main>
  <div class="card" id="nowCard"><div class="sk" style="width:60%"></div><div class="sk"></div><div class="sk" style="width:80%"></div></div>
  <div class="card hidden" id="journey"></div>
  <div class="card hidden" id="details"></div>
  <div class="card hidden" id="payment"></div>
  <div class="card hidden" id="rateCard">
    <div class="ttl" id="rateTitle">⭐ كيف كانت تجربتك معنا؟</div>
    <div class="stars" id="stars"></div>
    <textarea id="note"></textarea>
    <button class="btn send" id="sendRate"></button>
  </div>
  <div class="card hidden" id="thanksCard">
    <div class="ttl" style="justify-content:center;color:var(--green)" id="thanksTitle"></div>
    <p class="muted" id="thanksSub"></p>
    <a class="btn google hidden" id="googleBtn" target="_blank" rel="noopener"></a>
  </div>
  <div class="card hidden" id="contact">
    <div class="btns"><a class="btn wa" id="waBtn" target="_blank" rel="noopener"></a><a class="btn call" id="callBtn"></a></div>
    <div class="addr" id="addr"></div>
    <div class="live" id="live"></div>
  </div>
</main>

<script>
const SUPABASE_URL = "https://lstoqvehywpgmguiztoh.supabase.co";
const SUPABASE_KEY = "sb_publishable_TIwmDPRK-MXnii2qHcpIMA_n1nzqlGt";
const token = new URLSearchParams(location.search).get("t") || "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = v => Number(v || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
let data = null, skew = 0, stars = 0, rated = false;
let lang = (() => { try { return localStorage.getItem("gs-track-lang") || "ar"; } catch (e) { return "ar"; } })();

const T = {
  ar: { tag: "مطعم المأكولات البحرية", hello: n => `أهلاً ${n} 👋`, helloAnon: "أهلاً بك 👋", head: "هذا طلبك وأين وصل الآن", order: "طلب", journey: "🧭 رحلة طلبك", here: "طلبك هنا الآن",
        s: ["استلمنا طلبك", "جاري التحضير", "على النار", { "توصيل": "في الطريق إليك", "محلي": "جاهز على طاولتك", x: "جاهز للاستلام" }, "تم التسليم"],
        d: ["طلبك وصلنا وبدأنا ترتيبه", "الشيف يجهّز المكونات الطازجة", "طلبك يُطهى الآن بعناية", { "توصيل": "المندوب في الطريق إليك", "محلي": "بالعافية مقدماً 😋", x: "بانتظارك في الفرع 🐟" }, "بالعافية! نتمنى أن ينال إعجابك"],
        eta: m => `⏳ جاهز خلال ~${m} دقيقة تقريباً`, etaLate: "⏳ اللمسات الأخيرة… لحظات ويكون جاهزاً", details: "🧾 تفاصيل الطلب", pay: "💰 الدفع", total: "إجمالي الطلب", paidOk: "💚 تم الدفع — شكراً لك",
        paidNo: "💳 الدفع عند الاستلام (نقداً أو شبكة)", wa: "💬 تواصل واتساب", call: "📞 اتصل بنا", live: "تتحدث هذه الصفحة تلقائياً", rate: "⭐ كيف كانت تجربتك معنا؟", note: "ملاحظتك تهمنا (اختياري)",
        send: "إرسال التقييم", thanks: "شكراً لتقييمك 🙏", thanksSub: "رأيك يساعدنا نكون أفضل كل يوم", thanksGood: "سعداء إن الطلب عجبك! شاركنا رأيك على Google 💙", google: "⭐ قيّمنا على Google",
        notFound: "لم نجد هذا الطلب — تأكد من الرابط أو تواصل معنا", bad: "رابط التتبع غير صحيح", offline: "تعذر تحميل حالة الطلب — تحقق من الإنترنت", types: { "توصيل": "توصيل", "محلي": "داخل المطعم", x: "استلام من الفرع" }, ask: "استفسار عن طلبي رقم #" },
  en: { tag: "Seafood Restaurant", hello: n => `Hello, ${n} 👋`, helloAnon: "Hello 👋", head: "Here is your order and where it is now", order: "Order", journey: "🧭 Your order journey", here: "Your order is here now",
        s: ["Order received", "Preparing", "On the fire", { "توصيل": "On the way to you", "محلي": "Ready at your table", x: "Ready for pickup" }, "Delivered"],
        d: ["We received your order", "Our chef is preparing fresh ingredients", "Your order is being cooked with care", { "توصيل": "The driver is on the way", "محلي": "Enjoy your meal 😋", x: "Waiting for you at the branch 🐟" }, "Enjoy! We hope you love it"],
        eta: m => `⏳ Ready in about ${m} min`, etaLate: "⏳ Final touches… almost ready", details: "🧾 Order details", pay: "💰 Payment", total: "Order total", paidOk: "💚 Fully paid — thank you",
        paidNo: "💳 Pay on pickup (cash or card)", wa: "💬 Chat on WhatsApp", call: "📞 Call us", live: "This page updates automatically", rate: "⭐ How was your experience?", note: "Your feedback matters (optional)",
        send: "Send rating", thanks: "Thanks for your rating 🙏", thanksSub: "Your feedback helps us improve every day", thanksGood: "Glad you liked it! Share it on Google 💙", google: "⭐ Rate us on Google",
        notFound: "Order not found — check the link or contact us", bad: "Invalid tracking link", offline: "Couldn't load your order — check your connection", types: { "توصيل": "Delivery", "محلي": "Dine-in", x: "Pickup" }, ask: "Question about my order #" }
};
const L = () => T[lang];
const pick = (v, type) => typeof v === "object" ? (v[type] || v.x) : v;
const icons = ["📝", "🔪", "🔥", type => type === "توصيل" ? "🛵" : type === "محلي" ? "🍽" : "✅", "🤝"];
const fmtTime = t => new Date(t).toLocaleString(lang === "ar" ? "ar-SA-u-ca-gregory-nu-latn" : "en-GB", { weekday: "long", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Riyadh" });

async function rpc(fn, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: "POST", headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error("net");
  return r.json();
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem("gs-track-lang", l); } catch (e) {}
  document.documentElement.lang = l;
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  document.querySelectorAll(".langs button").forEach(b => b.classList.toggle("on", b.dataset.l === l));
  render();
}
document.querySelectorAll(".langs button").forEach(b => b.onclick = () => setLang(b.dataset.l));

function render() {
  const t = L();
  $("tagline").textContent = t.tag;
  $("headline").textContent = t.head;
  $("rateTitle").textContent = t.rate; $("note").placeholder = t.note; $("sendRate").textContent = t.send;
  $("thanksTitle").textContent = t.thanks; $("googleBtn").textContent = t.google;
  if (!data) return;
  const type = data.order_type || "سفري";
  const now = Date.now() + skew, created = new Date(data.created_at).getTime(), m = Math.max(3, data.stage_minutes || 10);
  const ready = data.ready_at ? new Date(data.ready_at).getTime() : 0, delivered = data.delivered_at ? new Date(data.delivered_at).getTime() : 0;
  const mins = Math.max(0, (now - created) / 60000);
  const stage = delivered ? 4 : ready ? 3 : Math.min(2, Math.floor(mins / m));
  const pct = delivered ? 100 : ready ? 85 : Math.min(75, Math.round(10 + (mins / (m * 3.5)) * 65));
  $("hello").textContent = data.customer ? t.hello(data.customer) : t.helloAnon;
  $("orderPill").textContent = `${t.order} #${data.daily_no} • ${pick(t.types, type)}`;
  $("orderPill").classList.remove("hidden");
  const ic = i => typeof icons[i] === "function" ? icons[i](type) : icons[i];
  const left = Math.max(1, Math.round(m * 3.5 - mins));
  $("nowCard").innerHTML = `<div class="now"><div class="ring" style="--p:${pct}"><div><div><div class="ic">${ic(stage)}</div><small>${pct}%</small></div></div></div>
    <div><h2>${esc(pick(t.s[stage], type))}</h2><p>${esc(pick(t.d[stage], type))}</p>${stage < 3 ? `<span class="eta">${mins < m * 3.5 ? t.eta(left) : t.etaLate}</span>` : ""}</div></div>`;
  // الرحلة: وقت كل مرحلة تمت
  const times = [created, created + m * 60000, created + 2 * m * 60000, ready, delivered];
  $("journey").innerHTML = `<div class="ttl">${t.journey}</div><div class="tl">` + t.s.map((s, i) => {
    const cls = i < stage || (i === stage && stage === 4) ? "done" : i === stage ? "cur" : "wait";
    const when = i <= stage && times[i] && times[i] <= now ? `<div class="d">${esc(fmtTime(times[i]))}</div>` : "";
    return `<div class="st ${cls}"><div class="dot">${cls === "done" ? "✓" : ic(i)}</div><div><div class="t">${esc(pick(s, type))}</div>${when}${cls === "cur" ? `<span class="here">${t.here}</span>` : ""}</div></div>`;
  }).join("") + "</div>";
  $("journey").classList.remove("hidden");
  // التفاصيل
  const items = Array.isArray(data.items) ? data.items : [];
  $("details").classList.toggle("hidden", !items.length);
  $("details").innerHTML = `<div class="ttl">${t.details}</div>` + items.map((it, i) => `<div class="item"><div class="num">${i + 1}</div><div><b>${esc(it.name)}</b><span>× ${Number(it.qty).toLocaleString("en-US", { maximumFractionDigits: 3 })}${it.notes ? " • " + esc(it.notes) : ""}</span></div></div>`).join("");
  // الدفع
  const unpaid = !data.payment_type || data.payment_type === "غير مدفوع";
  $("payment").innerHTML = `<div class="ttl">${t.pay}</div><div class="row"><span>${t.total}</span><b>${money(data.total)} ${lang === "ar" ? "ر.س" : "SAR"}</b></div>
    <div class="bar"><i style="width:${unpaid ? 0 : 100}%"></i></div><div class="paid ${unpaid ? "no" : "ok"}">${unpaid ? t.paidNo : t.paidOk}</div>`;
  $("payment").classList.toggle("hidden", data.total == null);
  // التواصل
  const wa = String(data.wa_phone || "").replace(/\D/g, ""), tel = String(data.store_phone || "").replace(/[^\d+]/g, "");
  $("waBtn").textContent = t.wa; $("waBtn").href = wa ? `https://wa.me/${wa}?text=${encodeURIComponent(t.ask + data.daily_no)}` : "#"; $("waBtn").classList.toggle("hidden", !wa);
  $("callBtn").textContent = t.call; $("callBtn").href = tel ? "tel:" + tel : "#"; $("callBtn").classList.toggle("hidden", !tel);
  $("addr").innerHTML = data.store_address ? `<b>${esc(data.store_name || "")}</b><br><a target="_blank" rel="noopener" href="https://maps.google.com/?q=${encodeURIComponent(data.store_address)}">📍 ${esc(data.store_address)}</a>` : `<b>${esc(data.store_name || "")}</b>`;
  $("live").textContent = t.live;
  $("contact").classList.remove("hidden");
  // التقييم
  const showRate = (ready || delivered) && !rated && !data.rating;
  $("rateCard").classList.toggle("hidden", !showRate);
  if (rated || data.rating) $("thanksCard").classList.remove("hidden");
}

function paintStars() {
  $("stars").innerHTML = [1, 2, 3, 4, 5].map(n => `<button aria-label="${n}" class="${n <= stars ? "on" : ""}" data-s="${n}">★</button>`).join("");
  $("stars").querySelectorAll("button").forEach(b => b.onclick = () => { stars = Number(b.dataset.s); paintStars(); });
}

async function load() {
  if (!token) { $("nowCard").innerHTML = `<p class="muted">${L().bad}</p>`; return; }
  try {
    const d = await rpc("track_get", { p_token: token });
    if (!d) { $("nowCard").innerHTML = `<p class="muted">${L().notFound}</p>`; return; }
    data = d;
    skew = new Date(d.now).getTime() - Date.now();
    $("store").textContent = d.store_name || "غاوي سمك";
    document.title = `#${d.daily_no} — ${d.store_name || "غاوي سمك"}`;
    if (d.review_url) $("googleBtn").href = d.review_url;
    render();
  } catch (e) { if (!data) $("nowCard").innerHTML = `<p class="muted">${L().offline}</p>`; }
}

$("sendRate").onclick = async () => {
  if (!stars) { $("stars").animate([{ transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "none" }], 300); return; }
  $("sendRate").disabled = true;
  try {
    await rpc("track_rate", { p_token: token, p_stars: stars, p_note: $("note").value.trim() });
    rated = true;
    $("rateCard").classList.add("hidden");
    $("thanksCard").classList.remove("hidden");
    $("thanksSub").textContent = stars >= 4 && data && data.review_url ? L().thanksGood : L().thanksSub;
    if (stars >= 4 && data && data.review_url) $("googleBtn").classList.remove("hidden");
  } catch (e) { $("sendRate").disabled = false; }
};

paintStars();
setLang(lang);
load();
setInterval(load, 30000);
setInterval(render, 10000);
</script>
</body>
</html>
