<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c5596">
<title>اطلب من طاولتك — غاوي سمك</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy: #1c5596; --navy2: #123d6e; --green: #2f9e66; --orange: #e07b24; --red: #c0503f; --ink: #1d2b3a; --muted: #6b7a8c; --line: #e3e9f0; --bg: #f2f5f9; --card: #fff; --soft: #eef4fb; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font-family: Tajawal, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; padding-bottom: 96px; }
  button, input, textarea { font: inherit; }
  .hidden { display: none !important; }
  header { background: linear-gradient(160deg, var(--navy), var(--navy2)); color: #fff; padding: 16px 16px 20px; }
  .top { display: flex; align-items: center; gap: 12px; max-width: 760px; margin: 0 auto; }
  .top img { width: 48px; height: 48px; border-radius: 14px; background: #fff; padding: 5px; }
  .top h1 { margin: 0; font-size: 1.15rem; font-weight: 800; }
  .top p { margin: 2px 0 0; opacity: .85; font-size: .88rem; }
  .table { margin-inline-start: auto; background: #fff; color: var(--navy); border-radius: 14px; padding: 6px 12px; font-weight: 800; text-align: center; line-height: 1.1; }
  .table small { display: block; font-size: .7rem; color: var(--muted); font-weight: 700; }
  .bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 6px; box-shadow: 0 6px 12px -10px rgba(0,0,0,.25); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 12px; }
  .search { width: 100%; border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; background: #fff; font-size: 1rem; outline: none; }
  .search:focus { border-color: var(--navy); }
  .cats { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cat { flex: none; border: 0; background: #fff; color: var(--ink); border-radius: 30px; padding: 8px 16px; font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.06); cursor: pointer; white-space: nowrap; }
  .cat.on { background: var(--navy); color: #fff; }
  h2.sec { font-size: 1.05rem; margin: 18px 4px 10px; color: var(--navy); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 620px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .p { background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: 0 3px 12px rgba(20,40,70,.06); cursor: pointer; display: flex; flex-direction: column; border: 0; padding: 0; text-align: inherit; color: inherit; }
  .p .img { aspect-ratio: 3 / 2; background: linear-gradient(135deg, #dce8f5, #f2f6fb); display: grid; place-items: center; font-size: 2.2rem; overflow: hidden; }
  .p .img img { width: 100%; height: 100%; object-fit: cover; }
  .p .b { padding: 9px 10px 11px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .p .n { font-weight: 800; font-size: .98rem; line-height: 1.3; }
  .p .pr { color: var(--green); font-weight: 800; margin-top: auto; }
  .p .pr small { color: var(--muted); font-weight: 600; }
  .p .q { position: absolute; }
  .badge { background: var(--orange); color: #fff; border-radius: 20px; padding: 0 8px; font-size: .8rem; font-weight: 800; margin-inline-start: 6px; }
  .cartbar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); z-index: 20; }
  .cartbar button { width: 100%; max-width: 736px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; border: 0; border-radius: 16px; background: var(--green); color: #fff; padding: 15px 18px; font-weight: 800; font-size: 1.05rem; box-shadow: 0 10px 24px rgba(47,158,102,.35); cursor: pointer; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(15,25,40,.5); z-index: 30; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
  .sheet { background: #fff; width: 100%; max-width: 620px; max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 0 0 calc(16px + env(safe-area-inset-bottom)); animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .5; } }
  @keyframes fade { from { opacity: 0; } }
  .sheet .hero { aspect-ratio: 16 / 8; background: linear-gradient(135deg, #dce8f5, #f2f6fb); display: grid; place-items: center; font-size: 3rem; overflow: hidden; position: relative; }
  .sheet .hero img { width: 100%; height: 100%; object-fit: cover; }
  .close { position: absolute; top: 10px; left: 10px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); font-size: 1.2rem; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .sheet .in { padding: 14px 16px 0; }
  .sheet h3 { margin: 0 0 4px; font-size: 1.3rem; }
  .muted { color: var(--muted); font-size: .9rem; }
  .lbl { font-weight: 800; margin: 16px 0 8px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 9px 14px; font-weight: 700; cursor: pointer; }
  .opt.on { border-color: var(--navy); background: var(--soft); color: var(--navy); }
  .opt small { color: var(--muted); font-weight: 600; }
  .step { display: flex; align-items: center; gap: 14px; }
  .step button { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--soft); color: var(--navy); font-size: 1.4rem; font-weight: 800; cursor: pointer; }
  .step b { min-width: 70px; text-align: center; font-size: 1.25rem; }
  textarea, .inp { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 11px; font-size: 1rem; outline: none; background: #fff; }
  textarea { min-height: 60px; resize: vertical; }
  .add { width: 100%; margin-top: 16px; border: 0; border-radius: 14px; background: var(--green); color: #fff; padding: 15px; font-weight: 800; font-size: 1.05rem; cursor: pointer; display: flex; justify-content: space-between; }
  .add:disabled { opacity: .6; }
  .line { display: flex; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .line .t { flex: 1; }
  .line .t b { display: block; }
  .mini { display: flex; align-items: center; gap: 6px; }
  .mini button { width: 32px; height: 32px; border-radius: 10px; border: 0; background: var(--soft); color: var(--navy); font-weight: 800; font-size: 1.1rem; cursor: pointer; }
  .tot { display: flex; justify-content: space-between; font-size: 1.15rem; font-weight: 800; padding: 14px 0 4px; }
  .note { background: #fff8ec; color: #7a5520; border-radius: 12px; padding: 10px 12px; font-size: .9rem; margin-top: 10px; }
  .center { text-align: center; }
  .state { max-width: 520px; margin: 24px auto; padding: 0 14px; }
  .card { background: #fff; border-radius: 20px; padding: 26px 20px; box-shadow: 0 8px 28px rgba(20,40,70,.08); text-align: center; }
  .card .ic { font-size: 3.4rem; }
  .card h2 { margin: 8px 0 6px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 800; cursor: pointer; text-decoration: none; margin-top: 12px; width: 100%; }
  .btn.green { background: var(--green); color: #fff; }
  .btn.navy { background: var(--navy); color: #fff; }
  .btn.light { background: var(--soft); color: var(--navy); }
  .spin { width: 42px; height: 42px; border: 4px solid var(--soft); border-top-color: var(--navy); border-radius: 50%; animation: sp 1s linear infinite; margin: 8px auto; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 30px; z-index: 50; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <img src="icon.png" alt="" onerror="this.style.display='none'">
    <div><h1 id="store">غاوي سمك</h1><p id="welcome">اطلب من طاولتك</p></div>
    <div class="table hidden" id="tableBadge"><small>طاولة</small><span id="tableNo"></span></div>
  </div>
</header>

<div id="menuView" class="hidden">
  <div class="bar"><div class="wrap">
    <input class="search" id="q" type="search" placeholder="🔍 ابحث عن صنف…" autocomplete="off">
    <div class="cats" id="cats"></div>
  </div></div>
  <div class="wrap" id="list"></div>
</div>

<div class="state" id="stateView"><div class="card"><div class="spin"></div><p class="muted">جاري تحميل المنيو…</p></div></div>

<div class="cartbar hidden" id="cartbar"><button id="cartBtn"><span id="cartCount">🧺 طلبي</span><span id="cartTotal"></span></button></div>

<script>
const SUPABASE_URL = "https://lstoqvehywpgmguiztoh.supabase.co";
const SUPABASE_KEY = "sb_publishable_TIwmDPRK-MXnii2qHcpIMA_n1nzqlGt";
const qs = new URLSearchParams(location.search);
const TABLE = parseInt(qs.get("t") || "0", 10), KEY = qs.get("k") || "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = v => Number(v || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const qfmt = v => Number(v).toLocaleString("en-US", { maximumFractionDigits: 3 });
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const CART_KEY = "qr-cart-" + TABLE, ORDER_KEY = "qr-order-" + TABLE, INFO_KEY = "qr-info";
let menu = null, cart = store.get(CART_KEY) || [], cat = 0, pollTimer = null;

async function rpc(fn, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: "POST", headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error("تعذر الاتصال، حاول مرة أخرى");
  return r.json();
}
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }
function state(html) { $("menuView").classList.add("hidden"); $("cartbar").classList.add("hidden"); $("stateView").classList.remove("hidden"); $("stateView").innerHTML = `<div class="card">${html}</div>`; }

// ---------------- المنيو ----------------
const prod = id => menu.products.find(p => p.id === id);
function fromPrice(p) {
  if (p.sizes && p.sizes.length) return `<small>من</small> ${money(Math.min(...p.sizes.map(s => s.price)))} <small>ر.س</small>`;
  return `${money(p.price)} <small>ر.س${p.weighted ? " / كيلو" : ""}</small>`;
}
function inCart(id) { return cart.filter(l => l.productId === id).reduce((a, l) => a + (prod(id) && prod(id).weighted ? 1 : l.qty), 0); }
function renderMenu() {
  const q = $("q").value.trim();
  $("cats").innerHTML = `<button class="cat ${cat === 0 ? "on" : ""}" data-c="0">الكل</button>` + menu.categories.map(c => `<button class="cat ${cat === c.id ? "on" : ""}" data-c="${c.id}">${esc(c.name)}</button>`).join("");
  $("cats").querySelectorAll(".cat").forEach(b => b.onclick = () => { cat = Number(b.dataset.c); renderMenu(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  const groups = menu.categories.filter(c => cat === 0 || c.id === cat).map(c => ({ c, ps: menu.products.filter(p => p.cat === c.id && (!q || p.name.includes(q) || (p.en || "").toLowerCase().includes(q.toLowerCase()))) })).filter(g => g.ps.length);
  $("list").innerHTML = groups.length ? groups.map(g => `<h2 class="sec">${esc(g.c.name)}</h2><div class="grid">` + g.ps.map(p => {
    const n = inCart(p.id);
    return `<button class="p" data-p="${p.id}"><div class="img">${p.img ? `<img loading="lazy" src="${esc(p.img)}" alt="">` : "🐟"}</div>
      <div class="b"><div class="n">${esc(p.name)}${n ? `<span class="badge">${n}</span>` : ""}</div><div class="pr">${fromPrice(p)}</div></div></button>`;
  }).join("") + "</div>").join("") : '<div class="empty">لا توجد أصناف مطابقة</div>';
  $("list").querySelectorAll(".p").forEach(b => b.onclick = () => openProduct(Number(b.dataset.p)));
  paintCartBar();
}

// ---------------- اختيار الصنف ----------------
function openProduct(id) {
  const p = prod(id);
  const sel = { size: p.sizes && p.sizes.length ? p.sizes[0].name : "", qty: p.weighted ? 1 : 1, cooking: "", note: "" };
  const bg = document.createElement("div");
  bg.className = "sheet-bg";
  const priceOf = () => {
    if (sel.size) return (p.sizes.find(s => s.name === sel.size) || {}).price * sel.qty;
    const extra = p.weighted && sel.cooking ? (menu.cooking.find(c => c.name === sel.cooking) || {}).extra || 0 : 0;
    return (p.price + extra) * sel.qty;
  };
  const paint = () => {
    bg.innerHTML = `<div class="sheet">
      <div class="hero">${p.img ? `<img src="${esc(p.img)}" alt="">` : "🐟"}<button class="close" data-x>✕</button></div>
      <div class="in">
        <h3>${esc(p.name)}</h3>
        <div class="muted">${p.weighted && !sel.size ? "السعر للكيلو: " + money(p.price) + " ر.س" : ""}</div>
        ${p.sizes && p.sizes.length ? `<div class="lbl">الحجم</div><div class="opts">${p.sizes.map(s => `<button class="opt ${sel.size === s.name ? "on" : ""}" data-s="${esc(s.name)}">${esc(s.name)} <small>${money(s.price)}</small></button>`).join("")}</div>` : ""}
        ${p.weighted && !(p.sizes && p.sizes.length) ? `<div class="lbl">طريقة الطهي</div><div class="opts">${menu.cooking.map(c => `<button class="opt ${sel.cooking === c.name ? "on" : ""}" data-k="${esc(c.name)}">${esc(c.name)}${c.extra ? ` <small>+${money(c.extra)}/كيلو</small>` : ""}</button>`).join("")}</div>` : ""}
        <div class="lbl">${p.weighted && !sel.size ? "الوزن (كيلو)" : "الكمية"}</div>
        <div class="step"><button data-d="1">+</button><b>${p.weighted && !sel.size ? qfmt(sel.qty) + " كجم" : sel.qty}</b><button data-d="-1">−</button></div>
        <div class="lbl">ملاحظة <span class="muted">(اختياري)</span></div>
        <textarea data-n placeholder="مثال: بدون بصل، حار…">${esc(sel.note)}</textarea>
        <button class="add" data-add><span>أضف للطلب</span><span>${money(priceOf())} ر.س</span></button>
      </div></div>`;
    bg.querySelector("[data-x]").onclick = close;
    bg.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { sel.size = b.dataset.s; paint(); });
    bg.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { sel.cooking = sel.cooking === b.dataset.k ? "" : b.dataset.k; paint(); });
    bg.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
      const step = p.weighted && !sel.size ? 0.25 : 1, min = step;
      sel.qty = Math.max(min, Math.min(p.weighted && !sel.size ? 20 : 50, Math.round((sel.qty + step * Number(b.dataset.d)) * 100) / 100));
      sel.note = bg.querySelector("[data-n]").value; paint();
    });
    bg.querySelector("[data-n]").oninput = e => sel.note = e.target.value;
    bg.querySelector("[data-add]").onclick = () => {
      if (p.weighted && !sel.size && !sel.cooking && menu.cooking.length) { toast("اختر طريقة الطهي"); return; }
      const name = p.name + (sel.size ? ` (${sel.size})` : "");
      const same = cart.find(l => l.productId === p.id && l.size === sel.size && l.cooking === sel.cooking && l.note === sel.note.trim());
      if (same && !(p.weighted && !sel.size)) same.qty += sel.qty;
      else cart.push({ productId: p.id, name, size: sel.size, qty: sel.qty, cooking: sel.cooking, note: sel.note.trim(), unit: p.weighted && !sel.size ? "كجم" : "", price: priceOf() / sel.qty });
      store.set(CART_KEY, cart);
      close();
      toast("✔ أُضيف " + p.name);
      renderMenu();
    };
  };
  const close = () => bg.remove();
  bg.onclick = e => { if (e.target === bg) close(); };
  paint();
  document.body.appendChild(bg);
}

// ---------------- السلة ----------------
const cartTotal = () => cart.reduce((a, l) => a + l.price * l.qty, 0);
function paintCartBar() {
  $("cartbar").classList.toggle("hidden", !cart.length);
  $("cartCount").textContent = `🧺 ${cart.length} ${cart.length === 1 ? "صنف" : "أصناف"} • عرض الطلب`;
  $("cartTotal").textContent = money(cartTotal()) + " ر.س";
}
$("cartBtn").onclick = openCart;
function openCart() {
  const info = store.get(INFO_KEY) || {};
  const bg = document.createElement("div");
  bg.className = "sheet-bg";
  const paint = () => {
    if (!cart.length) { bg.remove(); renderMenu(); return; }
    bg.innerHTML = `<div class="sheet"><div class="in" style="position:relative;padding-top:18px">
      <button class="close" data-x style="top:12px">✕</button>
      <h3>🧺 طلبك — طاولة ${TABLE}</h3>
      ${cart.map((l, i) => `<div class="line"><div class="t"><b>${esc(l.name)}</b><span class="muted">${[l.cooking, l.note].filter(Boolean).map(esc).join(" • ")}</span></div>
        <div class="mini"><button data-i="${i}" data-d="1">+</button><b>${l.unit ? qfmt(l.qty) + " كجم" : l.qty}</b><button data-i="${i}" data-d="-1">−</button></div>
        <div style="min-width:74px;text-align:left;font-weight:800">${money(l.price * l.qty)}</div></div>`).join("")}
      <div class="tot"><span>الإجمالي التقريبي</span><span>${money(cartTotal())} ر.س</span></div>
      <div class="muted">الأسعار شاملة الضريبة، والفاتورة النهائية من الكاشير.</div>
      <div class="lbl">اسمك <span class="muted">(اختياري)</span></div><input class="inp" id="cName" value="${esc(info.name || "")}" maxlength="40">
      <div class="lbl">جوالك <span class="muted">(اختياري — لإرسال حالة طلبك واتساب)</span></div><input class="inp" id="cPhone" inputmode="tel" dir="ltr" value="${esc(info.phone || "")}" maxlength="15" placeholder="05xxxxxxxx">
      <div class="lbl">ملاحظة للطلب <span class="muted">(اختياري)</span></div><textarea id="cNote" maxlength="200"></textarea>
      <div class="note">💳 ${esc(menu.payNote || "الدفع عند الكاشير")}</div>
      <button class="add" id="send"><span>إرسال الطلب ${menu.approve ? "للتأكيد" : "للمطبخ"}</span><span>${money(cartTotal())} ر.س</span></button>
    </div></div>`;
    bg.querySelector("[data-x]").onclick = () => { bg.remove(); renderMenu(); };
    bg.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
      const l = cart[Number(b.dataset.i)], step = l.unit ? 0.25 : 1;
      l.qty = Math.round((l.qty + step * Number(b.dataset.d)) * 100) / 100;
      if (l.qty < step / 2) cart.splice(Number(b.dataset.i), 1);
      store.set(CART_KEY, cart); paint();
    });
    bg.querySelector("#send").onclick = async () => {
      const btn = bg.querySelector("#send");
      const name = bg.querySelector("#cName").value.trim(), phone = bg.querySelector("#cPhone").value.replace(/[^\d+]/g, ""), note = bg.querySelector("#cNote").value.trim();
      if (phone && !/^(\+?966|0)?5\d{8}$/.test(phone)) { toast("رقم الجوال غير صحيح"); return; }
      store.set(INFO_KEY, { name, phone });
      btn.disabled = true; btn.firstElementChild.textContent = "جاري الإرسال…";
      try {
        const res = await rpc("qr_submit", { p_table: TABLE, p_token: KEY, p_order: { items: cart.map(l => ({ productId: l.productId, name: l.name, size: l.size, qty: l.qty, cooking: l.cooking, note: l.note })), customer: name, phone, note, estimate: Math.round(cartTotal() * 100) / 100 } });
        if (!res.ok) { toast(res.error || "تعذر إرسال الطلب"); btn.disabled = false; btn.firstElementChild.textContent = "إرسال الطلب"; return; }
        store.set(ORDER_KEY, { id: res.id, secret: res.secret, at: Date.now() });
        cart = []; store.set(CART_KEY, cart);
        bg.remove();
        watchOrder();
      } catch (e) { toast(e.message); btn.disabled = false; btn.firstElementChild.textContent = "إرسال الطلب"; }
    };
  };
  bg.onclick = e => { if (e.target === bg) { bg.remove(); renderMenu(); } };
  paint();
  document.body.appendChild(bg);
}

// ---------------- حالة الطلب بعد الإرسال ----------------
function trackLink(token) {
  const base = menu && menu.trackUrl ? menu.trackUrl : location.pathname.replace(/[^/]*$/, "") + "track.html";
  return base + (base.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(token);
}
async function watchOrder() {
  const o = store.get(ORDER_KEY);
  if (!o) { showMenu(); return; }
  clearTimeout(pollTimer);
  let s;
  try { s = await rpc("qr_status", { p_id: o.id, p_secret: o.secret }); } catch (e) { s = null; }
  if (!s) {
    state(`<div class="spin"></div><h2>جاري الاتصال…</h2><p class="muted">تأكد من الإنترنت</p>`);
  } else if (s.status === "accepted") {
    state(`<div class="ic">✅</div><h2>تم تأكيد طلبك${s.daily_no ? " رقم #" + s.daily_no : ""}</h2>
      <p class="muted">بدأنا تجهيز طلبك الآن 👨‍🍳${s.total ? "<br>الإجمالي: <b>" + money(s.total) + " ر.س</b>" : ""}</p>
      ${s.track_token ? `<a class="btn green" href="${esc(trackLink(s.track_token))}">📍 تابع حالة طلبك</a>` : ""}
      <button class="btn light" id="again">➕ طلب إضافي</button>`);
    $("again").onclick = () => { store.del(ORDER_KEY); showMenu(); };
    if (s.track_token && !o.redirected) { o.redirected = true; store.set(ORDER_KEY, o); setTimeout(() => { location.href = trackLink(s.track_token); }, 2500); }
    return;
  } else if (s.status === "rejected") {
    state(`<div class="ic">⚠️</div><h2>لم يتم قبول الطلب</h2><p class="muted">${esc(s.reason || "تواصل مع الكاشير")}</p>
      <button class="btn navy" id="again">العودة للمنيو</button>`);
    $("again").onclick = () => { store.del(ORDER_KEY); showMenu(); };
    return;
  } else {
    const mins = Math.floor((Date.now() - (o.at || Date.now())) / 60000);
    state(`<div class="spin"></div><h2>${s.status === "waiting" ? "⏳ بانتظار تأكيد المطعم" : "📨 تم إرسال طلبك"}</h2>
      <p class="muted">${menu && menu.approve ? "سيؤكد الكاشير طلبك خلال لحظات ثم يبدأ التجهيز" : "يُرسل طلبك للمطبخ الآن"}${mins >= 3 ? "<br>إذا تأخر التأكيد اطلب من الجرسون 🙏" : ""}</p>`);
  }
  pollTimer = setTimeout(watchOrder, 4000);
}

function showMenu() {
  $("stateView").classList.add("hidden");
  $("menuView").classList.remove("hidden");
  renderMenu();
}

async function start() {
  if (!TABLE || !KEY) { state(`<div class="ic">🔳</div><h2>امسح رمز الطاولة</h2><p class="muted">امسح رمز QR الموجود على طاولتك لفتح المنيو</p>`); return; }
  let d;
  try { d = await rpc("qr_get", { p_table: TABLE, p_token: KEY }); }
  catch (e) { state(`<div class="ic">📶</div><h2>تعذر الاتصال</h2><p class="muted">تحقق من الإنترنت ثم أعد المحاولة</p><button class="btn navy" onclick="location.reload()">إعادة المحاولة</button>`); return; }
  if (!d || !d.ok) { state(`<div class="ic">🔳</div><h2>رمز الطاولة غير صالح</h2><p class="muted">امسح الرمز الموجود على طاولتك أو اطلب من الجرسون</p>`); return; }
  if (!d.menu) { state(`<div class="ic">⏳</div><h2>المنيو قيد التحديث</h2><p class="muted">حاول بعد دقيقة</p>`); return; }
  menu = d.menu;
  $("store").textContent = menu.store || "غاوي سمك";
  $("welcome").textContent = menu.welcome || "اطلب من طاولتك";
  $("tableNo").textContent = TABLE;
  $("tableBadge").classList.remove("hidden");
  document.title = `طاولة ${TABLE} — ${menu.store || "غاوي سمك"}`;
  // أصناف في السلة لم تعد موجودة
  cart = cart.filter(l => prod(l.productId));
  $("q").oninput = renderMenu;
  if (store.get(ORDER_KEY)) watchOrder(); else showMenu();
}
start();
</script>
</body>
</html>
