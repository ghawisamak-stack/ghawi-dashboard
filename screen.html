<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>شاشة العرض — غاوي سمك</title>
<link rel="icon" href="icon.png">
<link rel="manifest" href="screen-manifest.json">
<link rel="apple-touch-icon" href="screen-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* صفحة شاشات المطعم: تُفتح على التلفزيون / جهاز أندرويد TV / كمبيوتر متصل بالشاشة */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: Tajawal, "Segoe UI", Tahoma, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; cursor: none; user-select: none; -webkit-user-select: none; }
  body.cur { cursor: default; }
  .hidden { display: none !important; }
  #rot { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000; transform-origin: 0 0; }
  .layer { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; opacity: 0; transition: opacity .9s ease, transform .9s ease; }
  .layer.on { opacity: 1; z-index: 2; }
  .t-none .layer { transition: none; }
  .t-slide .layer { transform: translateX(-100%); opacity: 1; }
  .t-slide .layer.on { transform: translateX(0); }
  .t-slide .layer.out { transform: translateX(100%); }
  .t-zoom .layer { transform: scale(1.08); }
  .t-zoom .layer.on { transform: scale(1); }
  .fill { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; }
  .media { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  .fit-contain .media { object-fit: contain; }
  .blurbg { position: absolute; left: -12%; top: -12%; width: 124%; height: 124%; background-size: cover; background-position: center; filter: blur(26px) brightness(.95) saturate(1.35); }
  /* الخلفية المضبّبة بالرسم المصغّر (تعمل على كل متصفحات التلفزيونات حتى بدون دعم الفلاتر) */
  .blurcv { position: absolute; left: -3%; top: -3%; width: 106%; height: 106%; filter: blur(10px) saturate(1.3); }
  .blurshade { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,.05) 35%, rgba(0,0,0,.4) 100%); }
  .blurbg::after { content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,.35) 100%); }
  .fit-contain .media.sharp { filter: drop-shadow(0 0 3vmin rgba(0,0,0,.55)); }
  .kb { animation: kb 14s ease-out forwards; }
  @keyframes kb { from { transform: scale(1); } to { transform: scale(1.07); } }

  /* شريحة صنف: صورة + اسم + سعر */
  .prod .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 58%; background: linear-gradient(to top, rgba(4,14,28,.92), rgba(4,14,28,.55) 45%, rgba(4,14,28,0)); }
  .prod .info { position: absolute; right: 5vw; left: 5vw; bottom: 7vh; display: flex; align-items: flex-end; justify-content: space-between; }
  .prod h2 { margin: 0; font-size: 7vmin; font-weight: 800; line-height: 1.15; text-shadow: 0 4px 24px rgba(0,0,0,.5); }
  .prod p { margin: 1.2vh 0 0; font-size: 3.4vmin; opacity: .85; font-weight: 500; }
  .price { flex: none; margin-right: 3vw; background: linear-gradient(135deg, #f7c548, #f08a24); color: #1b1305; border-radius: 3vmin; padding: 1.6vmin 3.4vmin; font-size: 7.5vmin; font-weight: 800; box-shadow: 0 1.5vmin 5vmin rgba(240,138,36,.35); white-space: nowrap; }
  .price small { font-size: .45em; font-weight: 700; margin-right: .3em; }
  /* صورة صنف صغيرة (مثل صور المنيو): بطاقة أنيقة بحجمها المناسب بدل تمديدها فتصبح ضبابية */
  .prod.small .shade { display: none; }
  .prod.small img.media { border-radius: 3vmin; box-shadow: 0 3vmin 8vmin rgba(0,0,0,.55); border: .5vmin solid rgba(255,255,255,.85); animation: none; }
  .prod.small .info { left: auto; right: 5vw; bottom: auto; top: 50%; transform: translateY(-50%); flex-direction: column; align-items: flex-start; justify-content: center; }
  .prod.small h2 { font-size: 8.5vmin; }
  .prod.small .price { margin: 4vh 0 0; }
  .prod.noimg { background: radial-gradient(circle at 70% 20%, #1f8fd6 0%, #0b2340 55%, #050d18 100%); }

  /* شريحة نص (إعلان) */
  .text { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6vh 7vw; box-sizing: border-box; }
  .text h2 { margin: 0; font-weight: 800; line-height: 1.2; text-shadow: 0 6px 30px rgba(0,0,0,.25); }
  .text p { margin: 3vh 0 0; font-size: 4.2vmin; opacity: .9; font-weight: 500; line-height: 1.5; }
  .text .chip { margin-top: 4vh; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); border-radius: 99px; padding: 1.2vmin 3.5vmin; font-size: 5vmin; font-weight: 800; }

  /* الطبقات الثابتة: الشعار، الساعة، شريط الإعلانات */
  .brand { position: absolute; top: 3vh; right: 2.5vw; z-index: 5; display: flex; align-items: center; background: rgba(0,0,0,.35); border-radius: 99px; padding: .8vmin 2.2vmin .8vmin .8vmin; }
  .brand img { width: 6vmin; height: 6vmin; border-radius: 50%; background: #fff; margin-left: 1.4vmin; }
  .brand b { font-size: 3vmin; font-weight: 800; }
  .clock { position: absolute; top: 3vh; left: 2.5vw; z-index: 5; background: rgba(0,0,0,.35); border-radius: 99px; padding: 1vmin 2.6vmin; font-size: 3.4vmin; font-weight: 800; direction: ltr; }
  .ticker { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; height: 7.5vh; background: linear-gradient(90deg, #0b2340, #123a63); border-top: .5vh solid #f08a24; overflow: hidden; display: flex; align-items: center; }
  .ticker span { position: absolute; white-space: nowrap; font-size: 3.6vh; font-weight: 700; right: 0; padding-right: 100%; animation: tick linear infinite; }
  @keyframes tick { from { transform: translateX(0); } to { transform: translateX(100%); } }
  .with-ticker .prod .info { bottom: 12vh; }

  /* الربط والخمول والرسائل */
  .center { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4vh 6vw; box-sizing: border-box; z-index: 8;
            background: radial-gradient(circle at 80% 10%, #1f8fd6 0%, #0b2340 50%, #040b15 100%); }
  .center img.logo { width: 16vmin; height: 16vmin; border-radius: 50%; background: #fff; padding: 1.2vmin; }
  .center h1 { margin: 3vh 0 1vh; font-size: 6vmin; font-weight: 800; }
  .center .muted { opacity: .75; font-size: 3vmin; line-height: 1.6; max-width: 80vw; }
  .code { direction: ltr; display: flex; justify-content: center; margin: 4vh 0; }
  .code b { display: inline-block; width: 11vmin; height: 15vmin; line-height: 15vmin; margin: 0 1vmin; border-radius: 2.4vmin; background: rgba(255,255,255,.1); border: .4vmin solid rgba(255,255,255,.35); font-size: 10vmin; font-weight: 800; }
  .steps { text-align: right; font-size: 2.8vmin; line-height: 1.9; background: rgba(0,0,0,.25); border-radius: 2vmin; padding: 2vmin 4vmin; }
  .steps b { color: #f7c548; }
  .sleep { background: #000 !important; }
  .dot { position: fixed; bottom: 1.2vh; left: 1.2vw; z-index: 20; width: 1.4vmin; height: 1.4vmin; border-radius: 50%; background: #e74c3c; box-shadow: 0 0 1vmin #e74c3c; }
  .hint { position: fixed; bottom: 3vh; left: 50%; transform: translateX(-50%); z-index: 30; background: rgba(0,0,0,.75); border: 1px solid rgba(255,255,255,.25); border-radius: 99px; padding: 1.2vmin 3vmin; font-size: 2.4vmin; }
</style>
</head>
<body>
<div id="rot">
  <div class="layer" id="L0"></div>
  <div class="layer" id="L1"></div>
  <div class="brand hidden" id="brand"><img src="icon.png" alt=""><b id="brandName"></b></div>
  <div class="clock hidden" id="clock"></div>
  <div class="ticker hidden" id="ticker"><span id="tickerText"></span></div>
  <div class="center hidden" id="msg"></div>
</div>
<div class="dot hidden" id="offline" title="لا يوجد اتصال — تُعرض آخر نسخة محفوظة"></div>
<div class="hint hidden" id="hint">اضغط على الشاشة (أو زر OK) لملء الشاشة</div>

<script>
"use strict";
// ملاحظة: الكود متوافق مع متصفحات التلفزيونات القديمة (بدون ?. و ??)
var SUPABASE_URL = "https://lstoqvehywpgmguiztoh.supabase.co";
var SUPABASE_KEY = "sb_publishable_TIwmDPRK-MXnii2qHcpIMA_n1nzqlGt";
var POLL_MS = 20000;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } }

function rpc(fn, body) {
  return fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, { method: "POST", headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify(body), cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); });
}

// ---------- وقت الرياض (UTC+3 بدون توقيت صيفي) ----------
function riyadh() { var d = new Date(Date.now() + 3 * 3600000); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), dow: d.getUTCDay(), min: d.getUTCHours() * 60 + d.getUTCMinutes(), h: d.getUTCHours(), mi: d.getUTCMinutes() }; }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function todayIso() { var t = riyadh(); return t.y + "-" + pad(t.m) + "-" + pad(t.d); }
function toMin(s) { var m = /^(\d{1,2}):(\d{2})/.exec(s || ""); return m ? Number(m[1]) * 60 + Number(m[2]) : null; }
function inWindow(from, to) {
  var f = toMin(from), t = toMin(to), n = riyadh().min;
  if (f == null || t == null || f === t) return true;
  return f < t ? (n >= f && n < t) : (n >= f || n < t);  // يدعم الفترة الليلية (22:00 → 02:00)
}
function slideOn(s) {
  var day = todayIso();
  if (s.start_date && day < s.start_date) return false;
  if (s.end_date && day > s.end_date) return false;
  if (s.days && s.days.length && s.days.indexOf(riyadh().dow) < 0) return false;
  return inWindow(s.time_from, s.time_to);
}

// ---------- الربط ----------
var params = (function () { var o = {}; location.search.replace(/^\?/, "").split("&").forEach(function (p) { var kv = p.split("="); if (kv[0]) o[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || ""); }); return o; })();
if (params.reset === "1") { lsSet("gs-sig", null); }
var auth = null;
if (params.s && params.k) { auth = { s: Number(params.s), k: params.k, url: true }; lsSet("gs-sig", JSON.stringify({ s: auth.s, k: auth.k })); }
else { try { auth = JSON.parse(lsGet("gs-sig") || "null"); } catch (e) { auth = null; } }

function deviceId() {
  var d = lsGet("gs-sig-device");
  if (!d) { d = "tv-"; for (var i = 0; i < 28; i++) d += "abcdefghijklmnopqrstuvwxyz0123456789".charAt(Math.floor(Math.random() * 36)); lsSet("gs-sig-device", d); }
  return d;
}
function info() { var ua = navigator.userAgent; var m = /(Android[^;)]*|Windows NT [\d.]+|Tizen[^;)]*|Web0S|webOS|CrKey|Macintosh|Linux)/.exec(ua); return (screen.width + "×" + screen.height) + " • " + (m ? m[1] : "متصفح") + (window.matchMedia && matchMedia("(display-mode: fullscreen)").matches ? " • ملء الشاشة" : ""); }

var pairTimer = null, pairCode = null, pairAt = 0;
function showPair() {
  stopPlayer();
  var box = $("msg");
  box.classList.remove("hidden", "sleep");
  function render(code) {
    box.innerHTML = '<img class="logo" src="icon.png" alt=""><h1>ربط شاشة جديدة</h1>' +
      '<div class="muted">اكتب هذا الرمز في البرنامج أو موقع المدراء لربط هذه الشاشة</div>' +
      '<div class="code">' + (code ? code.split("").map(function (c) { return "<b>" + c + "</b>"; }).join("") : '<b>·</b><b>·</b><b>·</b><b>·</b><b>·</b><b>·</b>') + '</div>' +
      '<div class="steps">١) في <b>البرنامج</b>: الإعدادات ← <b>📺 الشاشات</b> ← <b>🔗 ربط شاشة بالرمز</b><br>' +
      '٢) أو في <b>موقع المدراء</b>: <b>📺 الشاشات</b> ← اكتب الرمز واختر رقم الشاشة ← ربط<br>' +
      '٣) تبدأ الشاشة العرض تلقائياً خلال ثوانٍ</div>';
  }
  render(pairCode);
  function ask() {
    rpc("signage_pair_start", { p_device: deviceId() }).then(function (j) {
      if (j && j.ok) { pairCode = j.code; pairAt = Date.now(); render(pairCode); }
      else render(null);
    }).catch(function () { render(null); $("offline").classList.remove("hidden"); });
  }
  if (!pairCode || Date.now() - pairAt > 20 * 60000) ask();
  clearInterval(pairTimer);
  pairTimer = setInterval(function () {
    if (!pairCode || Date.now() - pairAt > 20 * 60000) { ask(); return; }
    rpc("signage_pair_check", { p_code: pairCode, p_device: deviceId() }).then(function (j) {
      $("offline").classList.add("hidden");
      if (j && j.ok) {
        clearInterval(pairTimer);
        auth = { s: j.screen, k: j.token };
        lsSet("gs-sig", JSON.stringify(auth));
        pairCode = null;
        box.innerHTML = '<img class="logo" src="icon.png" alt=""><h1>✔ تم ربط الشاشة رقم ' + j.screen + '</h1><div class="muted">جاري تحميل المحتوى…</div>';
        setTimeout(function () { poll(true); }, 1200);
      }
    }).catch(function () { $("offline").classList.remove("hidden"); });
  }, 4000);
}

// ---------- قائمة العرض ----------
var data = null, rev0 = null, playlist = [], idx = -1, timer = null, cur = 0, started = Date.now(), lastSig = "";
var settings = {};
function cacheKey() { return "gs-sig-cache-" + (auth ? auth.s : 0); }

function poll(first) {
  if (!auth) { showPair(); return; }
  rpc("signage_get", { p_screen: auth.s, p_token: auth.k, p_info: info() }).then(function (j) {
    $("offline").classList.add("hidden");
    if (!j || !j.ok) {
      // الرمز تغيّر أو الشاشة حُذفت
      lsSet("gs-sig", null); lsSet(cacheKey(), null);
      if (auth.url) { stopPlayer(); msg("رابط الشاشة غير صحيح", "تم تغيير رمز هذه الشاشة. افتح الرابط الجديد من البرنامج، أو افتح الصفحة بدون رابط واربطها بالرمز."); return; }
      auth = null; showPair(); return;
    }
    if (rev0 == null) rev0 = j.screen.rev;
    else if (j.screen.rev !== rev0) { location.reload(); return; }   // زر "إعادة تحميل" من البرنامج / الموقع
    lsSet(cacheKey(), JSON.stringify(j));
    apply(j);
  }).catch(function () {
    $("offline").classList.remove("hidden");
    if (first || !data) { try { var c = JSON.parse(lsGet(cacheKey()) || "null"); if (c) apply(c); else msg("لا يوجد اتصال بالإنترنت", "ستبدأ الشاشة تلقائياً عند عودة الاتصال"); } catch (e) { } }
  });
}

function msg(title, sub, sleep) {
  var box = $("msg");
  box.classList.remove("hidden");
  box.classList.toggle("sleep", !!sleep);
  box.innerHTML = sleep ? "" : '<img class="logo" src="icon.png" alt=""><h1>' + esc(title) + '</h1>' + (sub ? '<div class="muted">' + esc(sub) + '</div>' : "");
}

function apply(j) {
  data = j;
  settings = (j.screen && j.screen.settings) || {};
  var rot = $("rot");
  // التدوير للشاشات المعلقة بالطول
  var deg = Number(settings.rotate || 0);
  if (deg === 90 || deg === 270) { rot.style.width = "100vh"; rot.style.height = "100vw"; rot.style.transform = deg === 90 ? "rotate(90deg) translateY(-100%)" : "rotate(270deg) translateX(-100%)"; }
  else if (deg === 180) { rot.style.width = "100vw"; rot.style.height = "100vh"; rot.style.transform = "rotate(180deg) translate(-100%,-100%)"; }
  else { rot.style.width = "100vw"; rot.style.height = "100vh"; rot.style.transform = ""; }
  rot.className = "t-" + (settings.transition || "fade") + (settings.fit === "contain" ? " fit-contain" : "") + (settings.ticker ? " with-ticker" : "");
  $("brand").classList.toggle("hidden", !settings.logo);
  $("brandName").textContent = settings.brand || j.screen.name || "";
  $("clock").classList.toggle("hidden", !settings.clock);
  var tk = String(settings.ticker || "").trim();
  $("ticker").classList.toggle("hidden", !tk);
  if (tk && $("tickerText").textContent !== tk) { $("tickerText").textContent = tk + "     ✦     " + tk; $("tickerText").style.animationDuration = Math.max(14, tk.length * 0.38) + "s"; }
  rebuild();
}

function rebuild() {
  if (!data) return;
  var sl = data.slides || [];
  var pin = settings.pin ? sl.filter(function (x) { return x.id === settings.pin; }) : [];
  var list = pin.length ? pin : sl.filter(function (x) { return x.id !== settings.pin_hidden && slideOn(x); });
  var sig = JSON.stringify(list.map(function (x) { return [x.id, x.url, x.title, x.price, x.subtitle, x.duration, x.bg]; })) + "|" + (settings.fit || "") + "|" + (settings.interval || "");
  var asleep = !data.screen.active || !inWindow(settings.on_from, settings.on_to);
  if (asleep) { stopPlayer(); msg("", "", true); lastSig = ""; return; }
  if (!list.length) { stopPlayer(); msg(settings.brand || data.screen.name || "غاوي سمك", "لا يوجد محتوى للعرض الآن — أضف صوراً من البرنامج أو موقع المدراء"); lastSig = ""; return; }
  $("msg").classList.add("hidden");
  if (sig === lastSig && timer) return;           // نفس القائمة: لا نقطع العرض الحالي
  var curId = playlist[idx] ? playlist[idx].id : null;
  playlist = list;
  lastSig = sig;
  var keep = curId ? list.map(function (x) { return x.id; }).indexOf(curId) : -1;
  if (keep >= 0 && timer) { idx = keep; return; }
  idx = -1;
  next();
}

function stopPlayer() {
  clearTimeout(timer); timer = null;
  ["L0", "L1"].forEach(function (id) { var v = $(id).querySelector("video"); if (v) { try { v.pause(); } catch (e) { } } });
}

function durationOf(s) { var d = Number(s.duration || 0); if (!d) d = Number(settings.interval || 8); return Math.max(3, Math.min(600, d)) * 1000; }

function render(s, el, done) {
  var fit = settings.fit === "contain";
  var h = "";
  if (s.kind === "image") {
    h = (fit ? '<div class="blurbg" style="background-image:url(\'' + esc(s.url) + '\')"></div>' : "") +
        '<img class="media' + (fit ? " sharp" : "") + (fit || settings.kenburns === false ? "" : " kb") + '" alt="">' +
        (s.title ? '<div class="fill prod"><div class="shade"></div><div class="info"><div><h2>' + esc(s.title) + '</h2>' + (s.subtitle ? '<p>' + esc(s.subtitle) + '</p>' : "") + '</div></div></div>' : "");
  } else if (s.kind === "video") {
    h = '<video class="media" muted playsinline preload="auto"></video>';
  } else if (s.kind === "product") {
    h = '<div class="fill prod' + (s.url ? "" : " noimg") + '">' + (s.url ? '<img class="media' + (settings.kenburns === false ? "" : " kb") + '" alt="">' : "") +
        '<div class="shade"></div><div class="info"><div><h2>' + esc(s.title) + '</h2>' + (s.subtitle ? '<p>' + esc(s.subtitle) + '</p>' : "") + '</div>' +
        (s.price ? '<div class="price">' + esc(String(s.price).replace(/\s*ر\.?س\.?\s*$/, "")) + '<small>ر.س</small></div>' : "") + '</div></div>';
  } else {
    var t = String(s.title || ""), size = t.length > 60 ? 6 : t.length > 30 ? 8 : t.length > 14 ? 10.5 : 13;
    var bg = s.bg || "#0b2340";
    h = '<div class="fill text" style="background:radial-gradient(circle at 75% 15%, rgba(255,255,255,.18), rgba(0,0,0,0) 55%), ' + esc(bg) + '">' +
        '<h2 style="font-size:' + size + 'vmin">' + esc(t) + '</h2>' + (s.subtitle ? '<p>' + esc(s.subtitle) + '</p>' : "") + (s.price ? '<div class="chip">' + esc(s.price) + '</div>' : "") + '</div>';
  }
  el.innerHTML = h;
  var img = el.querySelector("img.media"), vid = el.querySelector("video");
  if (img) {
    var ok = false;
    img.onload = function () {
      ok = true;
      if (fit && img.naturalWidth) {
        var rot = $("rot"), sw = rot.clientWidth || innerWidth, sh = rot.clientHeight || innerHeight;
        var ir = img.naturalWidth / img.naturalHeight, sr = sw / sh;
        var bb = el.querySelector(".blurbg");
        if (Math.abs(ir - sr) / sr < 0.15) { img.style.objectFit = "cover"; if (bb) bb.style.display = "none"; }
        else {
          // تعبئة الأطراف: نسخة مصغّرة جداً من الصورة تُكبَّر على كامل الشاشة فتظهر مضبّبة بألوانها
          try {
            var cv = document.createElement("canvas");
            cv.width = 48; cv.height = Math.max(8, Math.round(48 * sh / sw));
            var cx = cv.getContext("2d"), k = Math.max(cv.width / img.naturalWidth, cv.height / img.naturalHeight);
            var dw = img.naturalWidth * k, dh = img.naturalHeight * k;
            cx.drawImage(img, (cv.width - dw) / 2, (cv.height - dh) / 2, dw, dh);
            cv.className = "blurcv";
            var shade = document.createElement("div"); shade.className = "blurshade";
            el.insertBefore(shade, el.firstChild);
            el.insertBefore(cv, el.firstChild);
            if (bb) bb.style.display = "none";
          } catch (e) { }
        }
      }
      // صنف بصورة صغيرة: بطاقة على اليسار + الاسم والسعر على اليمين + خلفية مضبّبة من نفس الصورة
      var pr = el.querySelector(".prod");
      if (pr && img.naturalWidth) {
        var R = $("rot"), W = R.clientWidth || innerWidth, H = R.clientHeight || innerHeight, dpr = window.devicePixelRatio || 1;
        var nw = img.naturalWidth, nh = img.naturalHeight;
        if (nw < W * dpr * 0.7) {
          pr.classList.add("small");
          var bw = Math.min(Math.max(nw * 1.6 / dpr, W * 0.34), W * 0.46), bh = bw * nh / nw;
          if (bh > H * 0.72) { bh = H * 0.72; bw = bh * nw / nh; }
          img.className = "media";
          img.style.cssText = "left:" + Math.round(W * 0.06) + "px;top:" + Math.round((H - bh) / 2) + "px;width:" + Math.round(bw) + "px;height:" + Math.round(bh) + "px;object-fit:cover";
          var info = pr.querySelector(".info");
          if (info) info.style.width = Math.round(W - bw - W * 0.17) + "px";
          try {
            var cv2 = document.createElement("canvas");
            cv2.width = 48; cv2.height = Math.max(8, Math.round(48 * H / W));
            var c2 = cv2.getContext("2d"), k2 = Math.max(cv2.width / nw, cv2.height / nh);
            c2.drawImage(img, (cv2.width - nw * k2) / 2, (cv2.height - nh * k2) / 2, nw * k2, nh * k2);
            cv2.className = "blurcv";
            var sh2 = document.createElement("div"); sh2.className = "blurshade"; sh2.style.background = "linear-gradient(to left, rgba(4,14,28,.75), rgba(4,14,28,.35))";
            pr.insertBefore(sh2, pr.firstChild);
            pr.insertBefore(cv2, pr.firstChild);
          } catch (e) { pr.style.background = "radial-gradient(circle at 70% 20%, #1f8fd6 0%, #0b2340 55%, #050d18 100%)"; }
        }
      }
      done(true);
    };
    img.onerror = function () { done(false); };
    img.src = s.url;
    setTimeout(function () { if (!ok) done(img.complete && img.naturalWidth > 0); }, 15000);
  } else if (vid) {
    var fired = false;
    vid.oncanplay = function () { if (!fired) { fired = true; done(true); } };
    vid.onerror = function () { if (!fired) { fired = true; done(false); } };
    vid.src = s.url;
    setTimeout(function () { if (!fired) { fired = true; done(vid.readyState >= 2); } }, 20000);
  } else done(true);
}

var fails = 0;
function next(step) {
  clearTimeout(timer);
  if (!playlist.length) return;
  idx = (idx + (step || 1) + playlist.length) % playlist.length;
  var s = playlist[idx];
  var incoming = $(cur === 0 ? "L1" : "L0"), outgoing = $(cur === 0 ? "L0" : "L1");
  render(s, incoming, function (ok) {
    if (!ok) { fails++; timer = setTimeout(function () { next(); }, fails > playlist.length ? 5000 : 50); return; }
    fails = 0;
    incoming.classList.remove("out"); incoming.classList.add("on");
    outgoing.classList.remove("on"); outgoing.classList.add("out");
    setTimeout(function () { var v = outgoing.querySelector("video"); if (v) try { v.pause(); } catch (e) { } outgoing.innerHTML = ""; outgoing.classList.remove("out"); }, 1100);
    cur = 1 - cur;
    var v = incoming.querySelector("video");
    if (v) {
      v.currentTime = 0;
      var p = v.play(); if (p && p.catch) p.catch(function () { });
      var cap = Number(s.duration || 0) ? durationOf(s) : 10 * 60000;
      v.onended = function () { next(); };
      timer = setTimeout(function () { next(); }, cap);
      if (playlist.length === 1) { v.loop = true; clearTimeout(timer); }
    } else if (playlist.length > 1) {
      timer = setTimeout(function () { next(); }, durationOf(s));
      // تحميل الصورة التالية مسبقاً
      var n = playlist[(idx + 1) % playlist.length];
      if (n && n.url && n.kind !== "video") { var pre = new Image(); pre.src = n.url; }
    } else timer = setTimeout(function () { rebuild(); }, 60000);
  });
}

// ---------- الساعة وفحص الجدولة ----------
setInterval(function () {
  var t = riyadh(), h12 = t.h % 12 || 12;
  $("clock").textContent = h12 + ":" + pad(t.mi) + (t.h < 12 ? " ص" : " م");
}, 1000);
setInterval(function () { if (data) rebuild(); }, 30000);           // بداية/نهاية فترات العرض
setInterval(function () { poll(false); }, POLL_MS);
// إعادة تحميل يومية فجراً (تنظيف ذاكرة متصفح التلفزيون)
setInterval(function () { var t = riyadh(); if (Date.now() - started > 3 * 3600000 && t.h === 4 && t.mi < 2) location.reload(); }, 60000);

// ---------- ملء الشاشة ومنع إطفاء الشاشة ----------
function fs() {
  var d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen || d.mozRequestFullScreen || d.msRequestFullscreen;
  if (f && !(document.fullscreenElement || document.webkitFullscreenElement)) { try { var p = f.call(d); if (p && p.catch) p.catch(function () { }); } catch (e) { } }
  $("hint").classList.add("hidden");
}
var wake = null;
function keepAwake() { try { if (navigator.wakeLock && document.visibilityState === "visible") navigator.wakeLock.request("screen").then(function (w) { wake = w; }).catch(function () { }); } catch (e) { } }
document.addEventListener("visibilitychange", keepAwake);
document.addEventListener("click", fs);
var curT = null;
document.addEventListener("mousemove", function () { document.body.classList.add("cur"); clearTimeout(curT); curT = setTimeout(function () { document.body.classList.remove("cur"); }, 2500); });
document.addEventListener("keydown", function (e) {
  var k = e.key || "";
  if (k === "Enter" || k === "f" || k === "F") fs();
  else if (k === "ArrowLeft" || k === "MediaTrackNext") next(1);
  else if (k === "ArrowRight" || k === "MediaTrackPrevious") next(-1);
  else if (k === "r" || k === "R") location.reload();
});
if (!(document.fullscreenElement || document.webkitFullscreenElement) && window.innerHeight < screen.height - 40) {
  $("hint").classList.remove("hidden");
  setTimeout(function () { $("hint").classList.add("hidden"); }, 9000);
}
keepAwake();

else showPair();
